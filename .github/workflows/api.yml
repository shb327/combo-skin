name: api

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    # Placeholder values, the same as api/.env.example.
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "54320"
      POSTGRES_USER: combo
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: combo
    services:
      db:
        image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_USER: combo
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: combo
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready -U combo -d combo"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python -m combo_api.openapi --check
      - run: uv run python -m combo_api.catalog export-website --check
      - run: uv run pytest

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t combo-skin-api api
      - run: cp api/.env.example api/.env
      - run: docker compose up -d --wait
      - run: curl -fsS http://localhost:8000/health/ready
      - run: test "$(curl -fsS http://localhost:8000/knives | jq length)" -eq 20
      - run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/admin/me)" -eq 401
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
