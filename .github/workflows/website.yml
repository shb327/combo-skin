name: website

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run api:types:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The dev server serves /src/ paths, but a build does not include them.
      - name: Check the build references no /src/ paths
        run: |
          if grep -rlF '/src/' dist; then
            echo "::error::The build references /src/ paths; import the files instead."
            exit 1
          fi
      # The CSP allows no data: images or fonts, so every asset must be a file.
      - name: Check the build inlines no assets as data URLs
        run: |
          if grep -rlEi --include='*.js' --include='*.css' --include='*.html' 'data:(image|font)/' dist; then
            echo "::error::The build inlines an asset as a data: URL, which the CSP blocks."
            exit 1
          fi
      # The site bundles Montserrat and loads nothing from Google's font hosts.
      - name: Check the build bundles Montserrat and no Google fonts
        run: |
          if grep -rlE 'fonts\.(googleapis|gstatic)\.com' dist; then
            echo "::error::The build references Google's font hosts."
            exit 1
          fi
          ls dist/assets | grep -q 'montserrat-latin-400-normal-.*\.woff2'
      # The client reads its data files from its own origin: the old API setting is gone.
      - name: Check VITE_API_BASE_URL is gone and stops the build
        run: |
          if grep -rn VITE_API_BASE_URL src .env.example; then
            echo "::error::VITE_API_BASE_URL is still used; it was replaced by DEV_API_BASE_URL."
            exit 1
          fi
          if VITE_API_BASE_URL=http://localhost:8000 npx vite build --outDir /tmp/refused 2> refused.log; then
            echo "::error::A build with VITE_API_BASE_URL set did not stop."
            exit 1
          fi
          grep -q 'replaced by DEV_API_BASE_URL' refused.log
