# Local development stack. Production configuration lives in deploy/.
# Needs api/.env: copy it from api/.env.example first.
name: combo-skin

services:
  db:
    image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    env_file:
      - path: api/.env
        required: true
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
