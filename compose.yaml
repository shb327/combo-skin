# Local development stack. Production configuration lives in deploy/.
# Needs api/.env: copy it from api/.env.example first.
name: combo-skin

x-api: &api
  build: api
  env_file:
    - path: api/.env
      required: true
  environment:
    # Containers reach the database and storage on the Compose network, not the published ports.
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    STORAGE_ENDPOINT_URL: http://storage:9000

services:
  db:
    image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    env_file:
      - path: api/.env
        required: true
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # Loads the committed catalog snapshot. Safe to re-run: unchanged rows are left alone.
  catalog:
    <<: *api
    command: ["python", "-m", "combo_api.catalog", "import"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # S3-compatible object storage for screenshots: RustFS, with the credentials of api/.env.
  storage:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    env_file:
      - path: api/.env
        required: true
    # RustFS reads its credentials under its own names.
    entrypoint:
      - sh
      - -c
      - >-
        export RUSTFS_ACCESS_KEY="$$STORAGE_ACCESS_KEY_ID" RUSTFS_SECRET_KEY="$$STORAGE_SECRET_ACCESS_KEY"
        && exec /entrypoint.sh rustfs
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Creates both buckets and lets anyone read the public one. Safe to re-run.
  storage-init:
    <<: *api
    command: ["python", "-m", "combo_api.screenshots", "init"]
    restart: "no"
    depends_on:
      storage:
        condition: service_healthy

  api:
    <<: *api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      catalog:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

volumes:
  db-data:
  storage-data:
