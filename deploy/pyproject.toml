[project]
name = "combo-publish"
version = "0.1.0"
description = "Publishes Combo Skin to Cloudflare from the back office"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3>=1.43.126",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.6"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "pyyaml>=6.0.4",
    "ruff>=0.17",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and use fake credentials and temporary folders.
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# boto3 ships no type information; bucket.py wraps it behind a typed protocol.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
